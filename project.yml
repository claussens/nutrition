name: nutrition

options:
  bundleIdPrefix: com.claussen
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  # ConfigStore/ConfigSync parse the five bundled YAML sections.
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    # 1.0.0 across every app (2026-07-28). Three components, not "1.0", so the
    # marketing version App Store Connect shows matches what the app record
    # says and there is one version train per app rather than two.
    #
    # This is CFBundleShortVersionString. The BUILD number beside it
    # (CURRENT_PROJECT_VERSION / CFBundleVersion) is passed by
    # scripts/testflight.sh as the commit count on HEAD — TestFlight renders
    # the pair as "1.0.0 (245)", which is the per-build differentiation.
    # A combined string like "1.0.0-245" is NOT a legal CFBundleVersion:
    # Apple requires at most three period-separated integers and rejects
    # anything with a hyphen at upload.
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Automatic
    # Baked in so `xcodegen generate` never drops the team and device
    # builds stop demanding one. Same value as swish/future.
    DEVELOPMENT_TEAM: QATUG526J8

targets:
  nutrition:
    type: application
    platform: iOS
    sources:
      - path: nutrition
        excludes:
          - "**/.DS_Store"
          - "README.md"
    dependencies:
      - package: Yams
    settings:
      base:
        # Renamed from com.sclaussen.nutrition before the first App Store
        # Connect registration, onto the com.claussen prefix now shared by
        # every app on the team (swish, mivista, nutrition, future), which
        # replaced a three-way split between com.claussen, com.shane and
        # com.sclaussen. NOTE: com.sclaussen.nutrition IS already registered
        # on the developer portal from ordinary development — it is now an
        # orphan, and com.claussen.nutrition must be registered in its place,
        # WITH the HealthKit capability (see CODE_SIGN_ENTITLEMENTS below).
        PRODUCT_BUNDLE_IDENTIFIER: com.claussen.nutrition
        # Target is lowercase "nutrition"; the shipped app is "Nutrition".
        PRODUCT_NAME: Nutrition
        # Declared so App Store Connect stops halting every upload to ask.
        # Standard HTTPS only, which is exempt from the export-compliance
        # rules; answering here gives once what the dialog asks every time.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # HealthKit entitlement (com.apple.developer.healthkit). This is also
        # why com.sclaussen.nutrition had to be an EXPLICIT App ID from the
        # start: a wildcard App ID cannot carry an entitlement, so Xcode
        # registered one during development. Swish and MiVista, which request
        # nothing, rode the XC Wildcard instead — and that is precisely why
        # they need IDs created before they can ship.
        CODE_SIGN_ENTITLEMENTS: nutrition/nutrition.entitlements
        ENABLE_PREVIEWS: YES
        # Assets.xcassets was MOVED OUT of "Preview Content" on 2026-07-27
        # (it had been left there to make the XcodeGen conversion byte-match
        # the old project). It could not stay: this setting marks that folder
        # as development-only, and development assets survive a Release BUILD
        # but are STRIPPED FROM AN ARCHIVE — which is the thing TestFlight
        # uploads. Proven both ways on the same commit: the Release build's
        # .app carried a 2.4 MB Assets.car and the AppIcon PNGs, the Release
        # ARCHIVE's .app carried neither and had no CFBundleIcons at all. An
        # iconless build is an automatic App Store Connect rejection.
        #
        # "Preview Content" now holds only an EMPTY "Preview Assets.xcassets".
        # The theme colorsets (BlueYellow, BlackWhite, …) used to live there
        # too, which meant every archive shipped with no colors at all
        # (2026-09-06 audit). Colors live in Assets.xcassets; nothing the
        # app reads at runtime may go under "Preview Content".
        DEVELOPMENT_ASSET_PATHS: "\"nutrition/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # HealthStore.swift READS body mass, body fat % and active energy to
        # fill in the profile and writes nothing (it passes `toShare: nil`).
        #
        # BOTH purpose strings are nevertheless REQUIRED, and the Update one
        # must not be deleted on the reasoning that the app never writes —
        # that reasoning is about the code, and App Store validation is not.
        # It keys off the ENTITLEMENT: the archive embeds
        # com.apple.developer.healthkit, so an upload without this key is
        # rejected with "Missing purpose string in Info.plist ... should
        # contain a NSHealthUpdateUsageDescription key".
        #
        # Nothing local catches its absence. The Debug and Release builds are
        # clean, the 96-test suite is green, and a devicectl install to the
        # phone runs fine; only the upload fails, five minutes into a ship.
        # Deleting it cost exactly that on 2026-09-06. scripts/testflight.sh
        # now guards the archive for both keys so the next attempt fails in
        # seconds instead.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Nutrition reads your weight, body fat percentage and active energy from Health to set your daily calorie and macro goals."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Nutrition does not save any data to Health."
        # ── The Mac (Mac Catalyst), added 2026-09-06 ───────────────────
        # The same target, one more destination — not a second target and not
        # an AppKit fork. It can be that small because the UI is all SwiftUI
        # and the only three UIKit call sites in the tree
        # (UIApplication.resignFirstResponder in Extensions/View.swift,
        # UIColor.systemGroupedBackground in MealList, UIScreen.main.bounds in
        # IngredientList) all exist under Catalyst, so not one `#if os` was
        # needed. Catalyst rather than "Designed for iPad" because only
        # Catalyst produces a real Mac bundle that copies to /Applications and
        # launches from the Dock with Xcode quit; a "Designed for iPad" product
        # is an iOS Mach-O macOS re-stages in a temp Wrapper/ per launch, so
        # there is nothing stable to install. Pattern lifted from swish, which
        # did this first on 2026-07-28 and paid for the findings.
        #
        # Written as an explicit setting rather than XcodeGen's
        # `supportedDestinations: [iOS, macCatalyst]`: 2.46.0's two destination
        # presets write DIRECTLY CONFLICTING values for the two Mac keys
        # (iOS.yml says SUPPORTS_MACCATALYST NO + DESIGNED_FOR_IPHONE_IPAD YES,
        # macCatalyst.yml the exact inverse), so the outcome depends on merge
        # order. An explicit target setting always wins.
        SUPPORTS_MACCATALYST: YES
        # Off so there is exactly ONE macOS row in -showdestinations and a
        # bare `-destination platform=macOS` is unambiguous. Nothing is lost:
        # a "Designed for iPad" build cannot be installed anyway.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # The Mac app keeps `com.claussen.nutrition` rather than becoming
        # `maccatalyst.com.claussen.nutrition`. That id is what names the
        # UserDefaults suite every manager persists through (UserDefaultsStore,
        # keys `profiles` / `activeProfileId` / `mealIngredient.<profileId>`),
        # so a derived id would silently give the Mac its own empty store.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # Mac-only entitlements, and the interesting half is what they DROP:
        # HealthKit. The `[sdk=macosx*]` condition matches only the Catalyst
        # (iosmac) variant of the macOS SDK, so no phone or simulator build
        # ever reads this line and the iOS entitlement is untouched.
        #
        # Two reasons, and the first alone settles it. HealthKit is a
        # profile-backed entitlement: naming it forces automatic signing to
        # mint a Mac Catalyst development profile, which needs an Apple ID
        # signed into Xcode — this machine has none, and the build fails at
        # GatherProvisioningInputs with "No Accounts: Add a new account in
        # Accounts settings." Drop the entitlement and Xcode signs the macOS
        # product with the bare "Apple Development" certificate, no profile
        # involved. Second: it would buy nothing. There is no Health app on
        # macOS, HKHealthStore.isHealthDataAvailable() is false there, and
        # HealthStore.authorizeHealthKit already guards on exactly that — so
        # the Mac quietly falls back to the manually entered weight and body
        # fat percentage, which is the same path a phone with Health toggled
        # off takes.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Signing/nutrition-macCatalyst.entitlements
        # App Sandbox OFF on the Mac. It is not a Catalyst default — Xcode's
        # injected base entitlements never include it, and XcodeGen never runs
        # the target template that otherwise adds it — so this is a choice,
        # made because distribution is personal (built and installed locally,
        # no Mac App Store, no notarization) and a sandbox would need
        # network.client added back for ConfigSync's GitHub fetch, which is
        # the app's only remote dependency and fails SILENTLY without it.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": NO
        # No MACOSX_DEPLOYMENT_TARGET, deliberately: the Catalyst SDK variant
        # declares IPHONEOS_DEPLOYMENT_TARGET as its deployment-target setting,
        # which the project already pins at 16.0, so the macOS key would be
        # inert and misleading.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
      # Signing identity. Deliberately "Apple Development" in BOTH
      # configurations, including Release — this is NOT an oversight and must
      # not be "corrected" to Apple Distribution.
      #
      # With CODE_SIGN_STYLE: Automatic, Xcode signs the ARCHIVE for
      # development and `xcodebuild -exportArchive` RE-SIGNS the .ipa with the
      # distribution certificate, driven by `method: app-store-connect` in
      # scripts/ExportOptions.plist. Pinning Apple Distribution here
      # contradicts automatic signing and the archive fails outright with
      # "conflicting provisioning settings ... a conflicting code signing
      # identity Apple Distribution has been manually specified" — proven on
      # 2026-07-27, when exactly that change broke all four apps at once.
      #
      # Stated on the TARGET because XcodeGen's iOS preset writes its own
      # target-level identity ("iPhone Developer", the legacy spelling) that a
      # project-level line would lose to. This just makes the value explicit
      # and modern rather than generator-supplied.
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  nutritionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: nutritionTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: nutrition
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claussen.nutritionTests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nutrition.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Nutrition"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  nutrition:
    build:
      targets:
        nutrition: all
        nutritionTests: [test]
    test:
      targets: [nutritionTests]
